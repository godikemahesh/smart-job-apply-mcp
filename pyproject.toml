[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-job-apply-mcp"
version = "1.0.0"
description = "Autonomous Job Search, Filtering, and Auto-Apply MCP Server across 8 major job portals."
readme = "README.md"
authors = [{ name = "godikemahesh", email = "maheshgodike17@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = [
    "mcp",
    "mcp-server",
    "model-context-protocol",
    "job-application",
    "job-automation",
    "smart-job-apply",
    "job-apply",
    "auto-apply",
    "job-search",
    "job-hunting",
    "ai-agent",
    "automation",
    "playwright",
    "linkedin",
    "naukri",
    "indeed",
    "wellfound",
    "glassdoor",
    "recruiter-outreach",
    "career-automation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "playwright>=1.40.0",
    "google-api-python-client>=2.100.0",
    "google-auth>=2.20.0",
    "google-auth-oauthlib>=1.1.0",
    "google-auth-httplib2>=0.2.0",
    "groq>=0.9.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
]

[project.scripts]
smart-job-apply-mcp = "server:cli"
job-apply-mcp = "server:cli"
gmail-mcp = "gmail_server:cli"
job-apply-runner = "run:main"

[tool.setuptools]
py-modules = ["server", "config", "run", "agent", "gmail_server"]
packages = ["tools"]
